name: Update blocklist

on:
  schedule:
    - cron: "17 16 * * *"   # daily at 16:17 UTC (about 3am Sydney time)
  workflow_dispatch:         # lets you run it manually from the Actions tab
  push:
    paths:
      - sources.txt
      - allowlist.txt
      - extra-blocks.txt
      - scripts/build.py

permissions:
  contents: write

concurrency:
  group: update-blocklist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build merged blocklist
        run: python scripts/build.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- blocklist.txt && git ls-files --error-unmatch blocklist.txt >/dev/null 2>&1; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blocklist.txt
          git commit -m "Update blocklist ($(grep -m1 '^# Domains:' blocklist.txt | cut -d' ' -f3) domains)"
          git push
